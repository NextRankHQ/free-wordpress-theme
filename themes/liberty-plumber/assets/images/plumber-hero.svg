  <line x1="272" y1="200" x2="272" y2="254" stroke="#F97316" stroke-width="8" stroke-linecap="round"/>
  <line x1="310" y1="200" x2="310" y2="254" stroke="#F97316" stroke-width="8" stroke-linecap="round"/>
  <line x1="196" y1="294" x2="196" y2="342" stroke="#38BDF8" stroke-width="8" stroke-linecap="round"/>
  <line x1="234" y1="294" x2="234" y2="342" stroke="#38BDF8" stroke-width="8" stroke-linecap="round"/>
