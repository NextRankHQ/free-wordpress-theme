<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 640" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="840" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="coolFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="warmFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#FB923C" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="840" height="640" rx="20" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  <!-- Subtle technical blueprint grid -->
  <g stroke="#1E293B" stroke-width="1">
    <line x1="0" y1="120" x2="840" y2="120"/>
    <line x1="0" y1="240" x2="840" y2="240"/>
    <line x1="0" y1="360" x2="840" y2="360"/>
    <line x1="0" y1="480" x2="840" y2="480"/>
    <line x1="160" y1="0" x2="160" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
  </g>
  <!-- Glow Orbs -->
  <circle cx="670" cy="150" r="160" fill="#0284C7" fill-opacity="0.2"/>
  <circle cx="210" cy="490" r="180" fill="#EA580C" fill-opacity="0.16"/>

