  <rect x="105" y="248" width="120" height="32" rx="6" fill="#F8FAFC" stroke="#0EA5E9" stroke-width="2"/>
  <path d="M118 292 Q165 318 212 292" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <path d="M108 310 Q165 342 222 310" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 6"/>

