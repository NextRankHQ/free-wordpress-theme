  <rect x="395" y="248" width="120" height="32" rx="6" fill="#F8FAFC" stroke="#0EA5E9" stroke-width="2"/>
  <path d="M408 292 Q455 318 502 292" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>

