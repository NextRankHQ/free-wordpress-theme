  <path d="M560 495 H610" stroke="#EA580C" stroke-width="10"/>
  <path d="M560 512 H610" stroke="#0EA5E9" stroke-width="8"/>

  <!-- Floating Glass Smart Climate Controller Widget (Top Right) -->
  <rect x="555" y="55" width="235" height="165" rx="18" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5"/>
  <circle cx="632" cy="138" r="52" fill="#090D16" stroke="#0EA5E9" stroke-width="6"/>
  <path d="M596 168 A46 46 0 1 1 668 168" stroke="#EA580C" stroke-width="6" stroke-linecap="round"/>
  <circle cx="632" cy="138" r="24" fill="#0284C7"/>
  <!-- Snowflake + Flame symbol -->
  <path d="M632 124 V152 M618 138 H646" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <!-- Status Pills on Right of Dial -->
  <rect x="704" y="88" width="64" height="14" rx="7" fill="#22C55E"/>
  <rect x="704" y="114" width="52" height="14" rx="7" fill="#38BDF8"/>
  <rect x="704" y="140" width="64" height="14" rx="7" fill="#EA580C"/>
  <rect x="704" y="166" width="44" height="14" rx="7" fill="#64748B"/>
