  <circle cx="692" cy="340" r="48" fill="#0F172A" stroke="#334155" stroke-width="4"/>
  <path d="M692 340 C680 308 704 296 714 312 Z" fill="#38BDF8"/>
  <path d="M692 340 C724 328 736 352 720 362 Z" fill="#38BDF8"/>
  <path d="M692 340 C704 372 680 384 670 368 Z" fill="#38BDF8"/>
  <path d="M692 340 C660 352 648 328 664 318 Z" fill="#38BDF8"/>
  <circle cx="692" cy="340" r="11" fill="#EA580C" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Bottom Inverter Fan -->
  <circle cx="692" cy="458" r="48" fill="#0F172A" stroke="#334155" stroke-width="4"/>
  <path d="M692 458 C680 426 704 414 714 430 Z" fill="#38BDF8"/>
  <path d="M692 458 C724 446 736 470 720 480 Z" fill="#38BDF8"/>
  <path d="M692 458 C704 490 680 502 670 486 Z" fill="#38BDF8"/>
  <path d="M692 458 C660 470 648 446 664 436 Z" fill="#38BDF8"/>
  <circle cx="692" cy="458" r="11" fill="#EA580C" stroke="#FFFFFF" stroke-width="2"/>

