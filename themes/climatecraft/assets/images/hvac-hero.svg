  <line x1="70" y1="365" x2="560" y2="365" stroke="#334155" stroke-width="4"/>
  <line x1="70" y1="220" x2="560" y2="220" stroke="#334155" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="315" y1="220" x2="315" y2="545" stroke="#334155" stroke-width="3"/>

  <!-- Attic Air Handler & Sealed Trunk Ductwork -->
  <rect x="255" y="135" width="120" height="62" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="3"/>
  <rect x="275" y="150" width="35" height="32" rx="4" fill="#0284C7"/>
  <rect x="320" y="150" width="35" height="32" rx="4" fill="#EA580C"/>
  <!-- Supply Branches to Rooms -->
  <path d="M255 166 H165 V255" stroke="#38BDF8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M375 166 H465 V255" stroke="#38BDF8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M165 255 V405" stroke="#FB923C" stroke-width="8" stroke-linecap="round" stroke-dasharray="1 0"/>
  <path d="M465 255 V405" stroke="#FB923C" stroke-width="8" stroke-linecap="round"/>

