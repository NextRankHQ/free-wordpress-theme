<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" fill="none">
  <rect width="800" height="560" rx="20" fill="#090D16"/>
  <circle cx="660" cy="130" r="180" fill="#0284C7" fill-opacity="0.18"/>
  <circle cx="150" cy="430" r="190" fill="#EA580C" fill-opacity="0.15"/>
  <!-- Architectural Horizon Grid -->
  <line x1="40" y1="455" x2="760" y2="455" stroke="#334155" stroke-width="4"/>
  <!-- High-Roof Modern Commercial HVAC Sprinter Van -->
  <g transform="translate(75, 165)">
    <!-- Roof Solar & Ladder Rack -->
    <rect x="45" y="-22" width="390" height="10" rx="5" fill="#38BDF8"/>
    <rect x="85" y="-12" width="10" height="14" fill="#64748B"/>
    <rect x="385" y="-12" width="10" height="14" fill="#64748B"/>
    <!-- Sprinter Body (Dark Slate-Navy with Glacier & Flame Accents) -->
    <path d="M18 35 C18 15 34 0 54 0 H435 C468 0 495 25 518 75 L568 155 C576 168 580 184 580 202 V242 C580 252 572 260 562 260 H18 C8 260 0 252 0 242 V35 Z" fill="#1E293B" stroke="#475569" stroke-width="3"/>
    <!-- Dual-Tone Thermal Speed Stripes -->
    <polygon points="0,165 568,165 578,185 0,185" fill="#0EA5E9"/>
    <polygon points="0,185 578,185 580,202 0,202" fill="#EA580C"/>
    <!-- Cab Windshield & Side Window -->
    <path d="M425 22 H482 L532 112 H425 V22 Z" fill="#090D16" stroke="#38BDF8" stroke-width="2"/>
    <!-- Equipment Cutaway Window Showing Inverter & Gauges Inside Van -->
    <rect x="55" y="36" width="320" height="108" rx="12" fill="#090D16" stroke="#334155" stroke-width="3"/>
    <!-- Inside Van: Twin-Fan Heat Pump + Nitrogen/Refrigerant Tanks + Shelving -->
    <rect x="75" y="52" width="75" height="78" rx="6" fill="#F8FAFC"/>
    <circle cx="112" cy="91" r="24" fill="#0F172A" stroke="#0EA5E9" stroke-width="3"/>
    <circle cx="112" cy="91" r="7" fill="#EA580C"/>
    <rect x="175" y="62" width="34" height="68" rx="12" fill="#0284C7"/>
    <rect x="220" y="62" width="34" height="68" rx="12" fill="#EA580C"/>
    <rect x="275" y="54" width="80" height="16" rx="4" fill="#334155"/>
    <rect x="275" y="82" width="80" height="16" rx="4" fill="#334155"/>
    <rect x="275" y="110" width="80" height="16" rx="4" fill="#334155"/>
    <!-- LED Matrix Headlight -->
    <rect x="556" y="168" width="24" height="30" rx="6" fill="#38BDF8"/>
    <!-- Alloy Wheels -->
    <circle cx="135" cy="260" r="48" fill="#090D16" stroke="#64748B" stroke-width="8"/>
    <circle cx="135" cy="260" r="20" fill="#0EA5E9"/>
    <circle cx="465" cy="260" r="48" fill="#090D16" stroke="#64748B" stroke-width="8"/>
    <circle cx="465" cy="260" r="20" fill="#0EA5E9"/>
  </g>
