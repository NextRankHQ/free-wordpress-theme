  </g>
  <!-- Acoustic Noise Waves -->
  <path d="M165 180 Q135 240 165 300" stroke="#EF4444" stroke-width="6" stroke-linecap="round"/>
  <path d="M135 155 Q95 240 135 325" stroke="#EF4444" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 8"/>
  <path d="M555 180 Q585 240 555 300" stroke="#EF4444" stroke-width="6" stroke-linecap="round"/>
